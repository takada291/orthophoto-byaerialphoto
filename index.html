<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>オルソ化v0.1</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        body { margin: 0; padding: 0; display: flex; flex-direction: column; height: 100vh; font-family: sans-serif; }
        
        #header-controls {
            padding: 8px 15px;
            background: #2c3e50;
            color: white;
            display: flex;
            gap: 15px;
            align-items: center;
            z-index: 1000;
            flex-wrap: wrap;
        }
        
        .app-title { font-weight: bold; font-size: 16px; margin-right: 10px; }
        
        button {
            padding: 6px 12px;
            font-size: 12px;
            background-color: #3498db;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 4px;
            font-weight: bold;
        }
        button:hover { background-color: #2980b9; }
        .export-btn { background-color: #e67e22; }
        .export-btn:hover { background-color: #d35400; }
        .action-btn { background-color: #2ecc71; }
        .action-btn:hover { background-color: #27ae60; }

        select { padding: 4px; font-size: 12px; border-radius: 4px; border: 1px solid #ccc; }

        #main-container {
            display: flex;
            flex-grow: 1;
            width: 100%;
            height: calc(100vh - 50px);
        }

        /* 3画面の分割設定 */
        .pane { flex: 1; position: relative; border-right: 1px solid #ccc; display: flex; flex-direction: column; }
        .pane-header { background: #ecf0f1; padding: 4px 8px; font-size: 12px; font-weight: bold; text-align: center; border-bottom: 1px solid #ccc; }
        .map-container { flex-grow: 1; position: relative; }

        /* 左マップ（写真用） */
        #photo-map { width: 100%; height: 100%; background: #ddd; }
        
        /* 右マップの切り出し枠（A3横比率: 420x297） */
        #crop-guide {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80%; /* 画面幅の80% */
            aspect-ratio: 420 / 297;
            border: 2px dashed red;
            background: rgba(255,0,0,0.05);
            pointer-events: none; /* マップ操作を貫通させる */
            z-index: 1000;
            display: none;
        }
        #crop-guide::after {
            content: '切出範囲 (ドラッグ・ズームで調整)';
            position: absolute; top: 5px; left: 5px; color: red; font-size: 11px; font-weight: bold;
        }

        /* GCPリストパネル */
        #gcp-panel {
            position: absolute; bottom: 10px; left: 10px; background: rgba(255, 255, 255, 0.9);
            padding: 8px; border-radius: 6px; box-shadow: 0 0 10px rgba(0,0,0,0.3);
            width: 90%; max-height: 30%; overflow-y: auto; font-size: 11px; z-index: 1000;
        }
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #ccc; padding: 3px; text-align: center; }
    </style>
</head>
<body>

<div id="header-controls">
    <div class="app-title">オルソ化v0.1</div>
    
    <button onclick="document.getElementById('file-input').click()">1.空撮写真読込</button>
    <input type="file" id="file-input" accept=".jpg, .jpeg" style="display: none;">

    <button onclick="rotatePhoto(-90)">↺ 写真左回転</button>
    <button onclick="rotatePhoto(90)">写真右回転 ↻</button>

    <div style="margin-left: auto; display: flex; gap: 10px;">
        <button class="action-btn" onclick="processOrtho()">2.オルソ化実行 (右画面へ合成)</button>
        <button onclick="toggleCropGuide()">3.切り出し枠 表示/非表示</button>
        <button class="export-btn" onclick="exportCroppedImage()">4.枠内を透過PNG+JGWで出力</button>
    </div>
</div>

<div id="main-container">
    <!-- 左画面：写真 -->
    <div class="pane">
        <div class="pane-header">【写真】クリックでGCP設置 (青)</div>
        <div class="map-container" id="photo-map"></div>
        <div id="gcp-panel">
            <b>GCPリスト</b> (左右で3点ペアを作る)
            <table id="gcp-table">
                <thead><tr><th>ID</th><th>写真 X</th><th>写真 Y</th><th>地図 緯度</th><th>地図 経度</th></tr></thead>
                <tbody></tbody>
            </table>
        </div>
    </div>
    
    <!-- 中央画面：地理院地図 -->
    <div class="pane">
        <div class="pane-header">【地図】クリックでGCP設置 (赤)</div>
        <div class="map-container" id="center-map"></div>
    </div>

    <!-- 右画面：合成・出力 -->
    <div class="pane" style="border-right: none;">
        <div class="pane-header">【合成・出力】オルソ結果</div>
        <div class="map-container" id="right-map">
            <div id="crop-guide"></div>
        </div>
    </div>
</div>

<!-- ライブラリ読み込み -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/exif-js"></script>

<script>
    // ==========================================
    // 1. 各マップの初期化
    // ==========================================
    // 中央・右マップの背景レイヤー定義
    const stdTile = 'https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png';
    const orthoTile = 'https://cyberjapandata.gsi.go.jp/xyz/seamlessphoto/{z}/{x}/{y}.jpg';
    const osmTile = 'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png';
    const esriTile = 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}';

    // 左マップ（写真用 - 緯度経度ではなくピクセル座標系）
    const photoMap = L.map('photo-map', { crs: L.CRS.Simple, minZoom: -2, maxZoom: 2 });
    
    // 中央マップ（GCP用）
    const centerMap = L.map('center-map').setView([36.065, 136.221], 15);
    const centerBaseLayers = {
        "地理院地図 (標準)": L.tileLayer(stdTile, { maxNativeZoom: 18, maxZoom: 22 }),
        "地理院地図 (オルソ)": L.tileLayer(orthoTile, { maxNativeZoom: 18, maxZoom: 22 }),
        "OpenStreetMap": L.tileLayer(osmTile, { maxNativeZoom: 19, maxZoom: 22 }),
        "Esri 衛星画像": L.tileLayer(esriTile, { maxNativeZoom: 18, maxZoom: 22 })
    };
    centerBaseLayers["地理院地図 (標準)"].addTo(centerMap);
    L.control.layers(centerBaseLayers).addTo(centerMap);

    // 右マップ（出力確認用）
    const rightMap = L.map('right-map', { zoomControl: false }).setView([36.065, 136.221], 15);
    L.tileLayer(stdTile, { maxNativeZoom: 18, maxZoom: 22 }).addTo(rightMap);

    // 中央と右マップの視点（中心とズーム）を同期させる（任意）
    centerMap.on('move', () => { rightMap.setView(centerMap.getCenter(), centerMap.getZoom(), {animate: false}); });

    // ==========================================
    // 2. 写真読み込みとEXIF解析
    // ==========================================
    let currentPhotoObj = null; // 元画像オブジェクト
    let currentImageOverlay = null;
    let photoRotation = 0;
    
    document.getElementById('file-input').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;

        // EXIFからGPSを取得して中央マップを移動
        EXIF.getData(file, function() {
            const lat = EXIF.getTag(this, "GPSLatitude");
            const lon = EXIF.getTag(this, "GPSLongitude");
            if (lat && lon) {
                const latRef = EXIF.getTag(this, "GPSLatitudeRef") || "N";
                const lonRef = EXIF.getTag(this, "GPSLongitudeRef") || "E";
                const latDec = (lat[0] + lat[1]/60 + lat[2]/3600) * (latRef === "N" ? 1 : -1);
                const lonDec = (lon[0] + lon[1]/60 + lon[2]/3600) * (lonRef === "E" ? 1 : -1);
                centerMap.setView([latDec, lonDec], 18);
            }
        });

        // 写真を左マップに表示
        const reader = new FileReader();
        reader.onload = function(event) {
            const img = new Image();
            img.onload = function() {
                currentPhotoObj = img;
                photoRotation = 0;
                displayPhoto(img, photoRotation);
                
                // GCPリセット
                gcps = [];
                photoMarkers.clearLayers();
                centerMarkers.clearLayers();
                updateGcpTable();
            };
            img.src = event.target.result;
        };
        reader.readAsDataURL(file);
    });

    function displayPhoto(img, angle) {
        if (currentImageOverlay) photoMap.removeLayer(currentImageOverlay);
        
        // Canvasを使って画像を回転・描画
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        if (angle % 180 === 0) {
            canvas.width = img.width; canvas.height = img.height;
        } else {
            canvas.width = img.height; canvas.height = img.width;
        }
        ctx.translate(canvas.width/2, canvas.height/2);
        ctx.rotate(angle * Math.PI / 180);
        ctx.drawImage(img, -img.width/2, -img.height/2);

        const dataUrl = canvas.toDataURL();
        const bounds = [[0, 0], [canvas.height, canvas.width]];
        currentImageOverlay = L.imageOverlay(dataUrl, bounds).addTo(photoMap);
        photoMap.fitBounds(bounds);
    }

    window.rotatePhoto = function(deg) {
        if (!currentPhotoObj) return;
        photoRotation = (photoRotation + deg) % 360;
        displayPhoto(currentPhotoObj, photoRotation);
        // 回転させるとピクセル座標が変わるためGCPはリセット
        gcps = [];
        photoMarkers.clearLayers();
        centerMarkers.clearLayers();
        updateGcpTable();
    };

    // ==========================================
    // 3. GCP設定ロジック
    // ==========================================
    let gcps = [];
    const photoMarkers = L.layerGroup().addTo(photoMap);
    const centerMarkers = L.layerGroup().addTo(centerMap);

    // 左マップ（写真）クリック
    photoMap.on('click', function(e) {
        const id = gcps.length + 1;
        // 未設定のペアを探す
        let target = gcps.find(g => g.px === null);
        if (!target) {
            target = { id: id, px: e.latlng.lng, py: e.latlng.lat, lat: null, lon: null, pMarker: null, cMarker: null };
            gcps.push(target);
        } else {
            target.px = e.latlng.lng; target.py = e.latlng.lat;
        }
        if (target.pMarker) photoMarkers.removeLayer(target.pMarker);
        target.pMarker = L.circleMarker(e.latlng, {color: 'blue', radius: 6}).addTo(photoMarkers).bindTooltip("ID:"+target.id, {permanent:true}).openTooltip();
        updateGcpTable();
    });

    // 中央マップ（地図）クリック
    centerMap.on('click', function(e) {
        const id = gcps.length + 1;
        let target = gcps.find(g => g.lat === null);
        if (!target) {
            target = { id: id, px: null, py: null, lat: e.latlng.lat, lon: e.latlng.lng, pMarker: null, cMarker: null };
            gcps.push(target);
        } else {
            target.lat = e.latlng.lat; target.lon = e.latlng.lng;
        }
        if (target.cMarker) centerMarkers.removeLayer(target.cMarker);
        target.cMarker = L.circleMarker(e.latlng, {color: 'red', radius: 6}).addTo(centerMarkers).bindTooltip("ID:"+target.id, {permanent:true}).openTooltip();
        updateGcpTable();
    });

    function updateGcpTable() {
        const tbody = document.querySelector('#gcp-table tbody');
        tbody.innerHTML = '';
        gcps.forEach(g => {
            tbody.innerHTML += `<tr>
                <td>${g.id}</td>
                <td>${g.px ? g.px.toFixed(1) : '-'}</td>
                <td>${g.py ? g.py.toFixed(1) : '-'}</td>
                <td>${g.lat ? g.lat.toFixed(6) : '-'}</td>
                <td>${g.lon ? g.lon.toFixed(6) : '-'}</td>
            </tr>`;
        });
    }

    // ==========================================
    // 4. アフィン変換とオルソ化（右マップへ合成）
    // ==========================================
    let orthoLayers = []; // 合成したレイヤーの保持

    window.processOrtho = function() {
        const validGcps = gcps.filter(g => g.px !== null && g.lat !== null);
        if (validGcps.length < 3) {
            alert("写真側と地図側で、それぞれ最低3つのGCPペアを作成してください。");
            return;
        }

        // 簡易アフィン変換（3点のみ使用）
        const p1 = validGcps[0], p2 = validGcps[1], p3 = validGcps[2];
        const det = p1.px * (p2.py - p3.py) - p1.py * (p2.px - p3.px) + (p2.px * p3.py - p3.px * p2.py);
        if (Math.abs(det) < 1e-10) { alert("GCPが一直線です"); return; }

        const a = (p1.lon * (p2.py - p3.py) - p1.py * (p2.lon - p3.lon) + (p2.lon * p3.py - p3.lon * p2.py)) / det;
        const b = (p1.px * (p2.lon - p3.lon) - p1.lon * (p2.px - p3.px) + (p2.px * p3.lon - p3.px * p2.lon)) / det;
        const c = p1.lon - a * p1.px - b * p1.py;

        const d = (p1.lat * (p2.py - p3.py) - p1.py * (p2.lat - p3.lat) + (p2.lat * p3.py - p3.lat * p2.py)) / det;
        const e = (p1.px * (p2.lat - p3.lat) - p1.lat * (p2.px - p3.px) + (p2.px * p3.lat - p3.px * p2.lat)) / det;
        const f = p1.lat - d * p1.px - e * p1.py;

        // 写真の四隅の地理座標を計算
        const bounds = currentImageOverlay.getBounds();
        const minX = bounds.getWest(), maxX = bounds.getEast();
        const minY = bounds.getSouth(), maxY = bounds.getNorth();
        
        const corners = [
            {x: minX, y: minY}, {x: maxX, y: minY}, {x: minX, y: maxY}, {x: maxX, y: maxY}
        ];
        
        let minLon = Infinity, maxLon = -Infinity, minLat = Infinity, maxLat = -Infinity;
        corners.forEach(pt => {
            const lon = a * pt.x + b * pt.y + c;
            const lat = d * pt.x + e * pt.y + f;
            minLon = Math.min(minLon, lon); maxLon = Math.max(maxLon, lon);
            minLat = Math.min(minLat, lat); maxLat = Math.max(maxLat, lat);
        });

        // 簡易的にBoundingBoxで右マップにOverlayする
        // （本来はCanvas内でピクセル変形すべきですが、負荷軽減とプロトタイプのためLeafletのImageOverlayに任せます）
        const newLayer = L.imageOverlay(currentImageOverlay._url, [[minLat, minLon], [maxLat, maxLon]]).addTo(rightMap);
        orthoLayers.push(newLayer);
        
        alert("右画面へ合成しました。続けて別の写真を読み込んで合成できます。");
    };

    // ==========================================
    // 5. 切り出しとエクスポート（白透過処理）
    // ==========================================
    window.toggleCropGuide = function() {
        const guide = document.getElementById('crop-guide');
        guide.style.display = guide.style.display === 'none' || guide.style.display === '' ? 'block' : 'none';
    };

    window.exportCroppedImage = function() {
        const guide = document.getElementById('crop-guide');
        if (guide.style.display !== 'block') {
            alert("切り出し枠を表示して、出力したい範囲を枠に合わせてください。");
            return;
        }

        // 枠のDOM座標から地図上の緯度経度Boundsを取得
        const rect = guide.getBoundingClientRect();
        const mapRect = document.getElementById('right-map').getBoundingClientRect();
        
        const nwPoint = L.point(rect.left - mapRect.left, rect.top - mapRect.top);
        const sePoint = L.point(rect.right - mapRect.left, rect.bottom - mapRect.top);
        
        const nwLatLng = rightMap.containerPointToLatLng(nwPoint);
        const seLatLng = rightMap.containerPointToLatLng(sePoint);
        
        // 描画用Canvasの作成（出力解像度）
        const outWidth = 2100; // A3横相当の仮ピクセル
        const outHeight = 1485;
        const canvas = document.createElement('canvas');
        canvas.width = outWidth; canvas.height = outHeight;
        const ctx = canvas.getContext('2d', { willReadFrequently: true });

        // 背景を透明で初期化
        ctx.clearRect(0, 0, outWidth, outHeight);

        // 合成されたレイヤーを描画
        let loadedCount = 0;
        if (orthoLayers.length === 0) { alert("合成された画像がありません。"); return; }

        orthoLayers.forEach(layer => {
            const img = new Image();
            img.crossOrigin = "Anonymous";
            img.onload = function() {
                // 画像のBoundsと出力枠のBoundsから描画位置を計算
                const layerBounds = layer.getBounds();
                const lNw = layerBounds.getNorthWest();
                const lSe = layerBounds.getSouthEast();

                const lonRange = seLatLng.lng - nwLatLng.lng;
                const latRange = nwLatLng.lat - seLatLng.lat; // 北が上

                const sx = (lNw.lng - nwLatLng.lng) / lonRange * outWidth;
                const sy = (nwLatLng.lat - lNw.lat) / latRange * outHeight;
                const sw = (lSe.lng - lNw.lng) / lonRange * outWidth;
                const sh = (lNw.lat - lSe.lat) / latRange * outHeight;

                ctx.drawImage(img, sx, sy, sw, sh);
                loadedCount++;

                if (loadedCount === orthoLayers.length) {
                    processTransparencyAndExport(canvas, ctx, seLatLng, nwLatLng);
                }
            };
            img.src = layer._url;
        });
    };

    function processTransparencyAndExport(canvas, ctx, seLatLng, nwLatLng) {
        // 白地（RGBがほぼ255）を透明（Alpha=0）に変換
        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const data = imageData.data;
        for (let i = 0; i < data.length; i += 4) {
            // R, G, Bがすべて240以上なら白とみなして透明化
            if (data[i] > 240 && data[i+1] > 240 && data[i+2] > 240) {
                data[i+3] = 0; // Alphaを0に
            }
        }
        ctx.putImageData(imageData, 0, 0);

        // PNGとしてエクスポート（林小班図での透過利用のためPNG推奨、ただし拡張子はご要望通りにするため処理）
        const dataUrl = canvas.toDataURL('image/png');

        // JGWファイルの生成
        const pixelWidthDeg = (seLatLng.lng - nwLatLng.lng) / canvas.width;
        const pixelHeightDeg = (seLatLng.lat - nwLatLng.lat) / canvas.height;
        const jgwContent = `${pixelWidthDeg}\n0.0000000000\n0.0000000000\n${pixelHeightDeg}\n${nwLatLng.lng}\n${nwLatLng.lat}\n`;
        const blob = new Blob([jgwContent], { type: 'text/plain' });
        
        // JGWダウンロード
        const jgwLink = document.createElement('a');
        jgwLink.download = "ortho_export.jgw";
        jgwLink.href = URL.createObjectURL(blob);
        jgwLink.click();

        // 画像ダウンロード（拡張子はPNG）
        const imgLink = document.createElement('a');
        imgLink.download = "ortho_export.png"; 
        imgLink.href = dataUrl;
        imgLink.click();
    }
</script>
</body>
</html>
