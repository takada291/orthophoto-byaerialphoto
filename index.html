<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>オルソ化v1.0</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        body { margin: 0; padding: 0; display: flex; flex-direction: column; height: 100vh; font-family: sans-serif; }
        
        #header-controls {
            padding: 8px 15px;
            background: #2c3e50;
            color: white;
            display: flex;
            gap: 10px;
            align-items: center;
            z-index: 1000;
            flex-wrap: wrap;
        }
        
        .app-title { font-weight: bold; font-size: 15px; margin-right: 10px; color: #ecf0f1; }
        
        button {
            padding: 6px 10px;
            font-size: 11px;
            background-color: #3498db;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 4px;
            font-weight: bold;
        }
        button:hover { background-color: #2980b9; }
        .rotate-btn { background-color: #95a5a6; }
        .rotate-btn:hover { background-color: #7f8c8d; }
        .action-btn { background-color: #2ecc71; font-size: 12px; }
        .action-btn:hover { background-color: #27ae60; }
        .export-btn { background-color: #e67e22; }
        .export-btn:hover { background-color: #d35400; }

        #main-container {
            display: flex;
            flex-grow: 1;
            width: 100%;
            height: calc(100vh - 50px);
        }

        .pane { flex: 1; position: relative; border-right: 1px solid #ccc; display: flex; flex-direction: column; }
        .pane-header { background: #ecf0f1; padding: 4px 8px; font-size: 12px; font-weight: bold; text-align: center; border-bottom: 1px solid #ccc; color: #333; }
        .map-container { flex-grow: 1; position: relative; background: #ddd; }

        #crop-guide {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80%; 
            aspect-ratio: 420 / 297;
            border: 2px dashed red;
            background: rgba(255,0,0,0.05);
            pointer-events: none;
            z-index: 1000;
            display: none;
        }
        #crop-guide::after {
            content: '切出範囲 (ドラッグ・ズームで調整)';
            position: absolute; top: 5px; left: 5px; color: red; font-size: 11px; font-weight: bold;
        }

        #gcp-panel {
            position: absolute; bottom: 10px; left: 10px; background: rgba(255, 255, 255, 0.95);
            padding: 8px; border-radius: 6px; box-shadow: 0 0 10px rgba(0,0,0,0.3);
            width: 90%; max-height: 35%; overflow-y: auto; font-size: 11px; z-index: 1000; color: #333;
        }
        table { border-collapse: collapse; width: 100%; margin-top: 4px; }
        th, td { border: 1px solid #ccc; padding: 3px; text-align: center; }
        /* GCP手入力用のインプットスタイル */
        .coord-input { width: 75px; font-size: 11px; text-align: center; border: 1px solid #bdc3c7; border-radius: 2px; padding: 2px; }
        .coord-input:focus { border-color: #3498db; outline: none; background: #e8f4f8; }
    </style>
</head>
<body>

<div id="header-controls">
    <div class="app-title">オルソ化v1.0</div>
    
    <button onclick="document.getElementById('file-input').click()">1. 空撮写真読込</button>
    <input type="file" id="file-input" accept=".jpg, .jpeg" style="display: none;">

    <div style="display: flex; gap: 4px;">
        <button class="rotate-btn" onclick="rotatePhoto(-5)">↺ 左(5度)</button>
        <button class="rotate-btn" onclick="rotatePhoto(5)">右(5度) ↻</button>
        <button class="rotate-btn" onclick="rotatePhoto(-1)">↺ 左(1度)</button>
        <button class="rotate-btn" onclick="rotatePhoto(1)">右(1度) ↻</button>
    </div>

    <button class="action-btn" onclick="processPixelWarpOrtho()">2. 高精度オルソ化実行</button>
    
    <div style="margin-left: auto; display: flex; gap: 8px;">
        <button onclick="toggleCropGuide()">3. 切出枠 表示/非表示</button>
        <button class="export-btn" onclick="exportCroppedImage('app')">4. 林小班図アプリ用 (PNG)</button>
        <button class="export-btn" onclick="exportCroppedImage('gis')">5. GIS用 (PNG+PGW)</button>
    </div>
</div>

<div id="main-container">
    <div class="pane">
        <div class="pane-header">【写真】クリックでGCP設置 (青)</div>
        <div class="map-container" id="photo-map"></div>
        <div id="gcp-panel">
            <b>GCPリスト</b> (左右で3点ペアを作る。座標は直接入力で修正可)
            <table id="gcp-table">
                <thead><tr><th>ID</th><th>写真 X</th><th>写真 Y</th><th>地図 緯度 (Lat)</th><th>地図 経度 (Lon)</th></tr></thead>
                <tbody></tbody>
            </table>
        </div>
    </div>
    
    <div class="pane">
        <div class="pane-header">【地図】クリックでGCP設置 (赤)</div>
        <div class="map-container" id="center-map"></div>
    </div>

    <div class="pane" style="border-right: none;">
        <div class="pane-header">【合成・出力】オルソ結果</div>
        <div class="map-container" id="right-map">
            <div id="crop-guide"></div>
        </div>
    </div>
</div>

<!-- Leaflet & EXIF.js -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/exif-js"></script>

<script>
    // ==========================================
    // 1. 各マップの初期化
    // ==========================================
    const stdTile = 'https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png';
    const orthoTile = 'https://cyberjapandata.gsi.go.jp/xyz/seamlessphoto/{z}/{x}/{y}.jpg';
    const osmTile = 'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png';
    const esriTile = 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}';

    const photoMap = L.map('photo-map', { crs: L.CRS.Simple, minZoom: -5, maxZoom: 4, zoomSnap: 0.5 });
    
    const centerMap = L.map('center-map').setView([36.065, 136.221], 15);
    const centerBaseLayers = {
        "地理院地図 (標準)": L.tileLayer(stdTile, { maxNativeZoom: 18, maxZoom: 23 }),
        "地理院地図 (オルソ)": L.tileLayer(orthoTile, { maxNativeZoom: 18, maxZoom: 23 }),
        "OpenStreetMap": L.tileLayer(osmTile, { maxNativeZoom: 19, maxZoom: 23 }),
        "Esri 衛星画像": L.tileLayer(esriTile, { maxNativeZoom: 18, maxZoom: 23 })
    };
    centerBaseLayers["地理院地図 (標準)"].addTo(centerMap);
    L.control.layers(centerBaseLayers).addTo(centerMap);

    const rightMap = L.map('right-map', { zoomControl: false, maxZoom: 23 }).setView([36.065, 136.221], 15);
    L.tileLayer(stdTile, { maxNativeZoom: 18, maxZoom: 23 }).addTo(rightMap);

    centerMap.on('move', () => { rightMap.setView(centerMap.getCenter(), centerMap.getZoom(), {animate: false}); });

    // ==========================================
    // 2. 写真読み込み・回転・EXIF解析
    // ==========================================
    let currentPhotoObj = null; 
    let currentRotatedCanvas = null; 
    let currentImageOverlay = null;
    let photoRotation = 0;
    
    document.getElementById('file-input').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;

        EXIF.getData(file, function() {
            const lat = EXIF.getTag(this, "GPSLatitude");
            const lon = EXIF.getTag(this, "GPSLongitude");
            if (lat && lon) {
                const latRef = EXIF.getTag(this, "GPSLatitudeRef") || "N";
                const lonRef = EXIF.getTag(this, "GPSLongitudeRef") || "E";
                const latDec = (lat[0] + lat[1]/60 + lat[2]/3600) * (latRef === "N" ? 1 : -1);
                const lonDec = (lon[0] + lon[1]/60 + lon[2]/3600) * (lonRef === "E" ? 1 : -1);
                centerMap.setView([latDec, lonDec], 18);
            }
        });

        const reader = new FileReader();
        reader.onload = function(event) {
            const img = new Image();
            img.onload = function() {
                currentPhotoObj = img;
                photoRotation = 0;
                displayPhoto(img, photoRotation);
                resetGCPs();
            };
            img.src = event.target.result;
        };
        reader.readAsDataURL(file);
    });

    function displayPhoto(img, angle) {
        if (currentImageOverlay) photoMap.removeLayer(currentImageOverlay);
        
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        const rad = angle * Math.PI / 180;
        
        const cos = Math.abs(Math.cos(rad));
        const sin = Math.abs(Math.sin(rad));
        canvas.width = img.width * cos + img.height * sin;
        canvas.height = img.width * sin + img.height * cos;
        
        ctx.translate(canvas.width/2, canvas.height/2);
        ctx.rotate(rad);
        ctx.drawImage(img, -img.width/2, -img.height/2);

        currentRotatedCanvas = canvas;
        const dataUrl = canvas.toDataURL();
        
        const bounds = [[0, 0], [canvas.height, canvas.width]];
        currentImageOverlay = L.imageOverlay(dataUrl, bounds).addTo(photoMap);
        photoMap.fitBounds(bounds);
    }

    window.rotatePhoto = function(deg) {
        if (!currentPhotoObj) return;
        photoRotation = (photoRotation + deg) % 360;
        displayPhoto(currentPhotoObj, photoRotation);
        resetGCPs(); 
    };

    // ==========================================
    // 3. GCP設定ロジック (手入力修正機能追加)
    // ==========================================
    let gcps = [];
    const photoMarkers = L.layerGroup().addTo(photoMap);
    const centerMarkers = L.layerGroup().addTo(centerMap);

    function resetGCPs() {
        gcps = [];
        photoMarkers.clearLayers();
        centerMarkers.clearLayers();
        updateGcpTable();
    }

    photoMap.on('click', function(e) {
        if(!currentRotatedCanvas) return;
        const id = gcps.length + 1;
        let target = gcps.find(g => g.px === null);
        
        const px = e.latlng.lng;
        const py = currentRotatedCanvas.height - e.latlng.lat;

        if (!target) {
            target = { id: id, px: px, py: py, leafY: e.latlng.lat, lat: null, lon: null, pMarker: null, cMarker: null };
            gcps.push(target);
        } else {
            target.px = px; target.py = py; target.leafY = e.latlng.lat;
        }
        
        if (target.pMarker) photoMarkers.removeLayer(target.pMarker);
        target.pMarker = L.circleMarker(e.latlng, {color: 'blue', radius: 6}).addTo(photoMarkers).bindTooltip("ID:"+target.id, {permanent:true}).openTooltip();
        updateGcpTable();
    });

    centerMap.on('click', function(e) {
        const id = gcps.length + 1;
        let target = gcps.find(g => g.lat === null);
        if (!target) {
            target = { id: id, px: null, py: null, leafY: null, lat: e.latlng.lat, lon: e.latlng.lng, pMarker: null, cMarker: null };
            gcps.push(target);
        } else {
            target.lat = e.latlng.lat; target.lon = e.latlng.lng;
        }
        if (target.cMarker) centerMarkers.removeLayer(target.cMarker);
        target.cMarker = L.circleMarker(e.latlng, {color: 'red', radius: 6}).addTo(centerMarkers).bindTooltip("ID:"+target.id, {permanent:true}).openTooltip();
        updateGcpTable();
    });

    // ★GCP手動修正時の処理関数
    window.handleCoordInput = function(id, type, value) {
        const target = gcps.find(g => g.id === id);
        if (!target) return;
        
        const numVal = parseFloat(value);
        if (isNaN(numVal)) return;

        if (type === 'lat') target.lat = numVal;
        if (type === 'lon') target.lon = numVal;

        // マーカーの再配置
        if (target.lat !== null && target.lon !== null) {
            if (target.cMarker) centerMarkers.removeLayer(target.cMarker);
            const latlng = L.latLng(target.lat, target.lon);
            target.cMarker = L.circleMarker(latlng, {color: 'red', radius: 6}).addTo(centerMarkers).bindTooltip("ID:"+target.id, {permanent:true}).openTooltip();
        }
    };

    function updateGcpTable() {
        const tbody = document.querySelector('#gcp-table tbody');
        tbody.innerHTML = '';
        gcps.forEach(g => {
            // Lat/Lonセルをinputタグに変更
            const latInput = g.lat !== null ? `<input type="text" class="coord-input" value="${g.lat.toFixed(6)}" onchange="handleCoordInput(${g.id}, 'lat', this.value)">` : '-';
            const lonInput = g.lon !== null ? `<input type="text" class="coord-input" value="${g.lon.toFixed(6)}" onchange="handleCoordInput(${g.id}, 'lon', this.value)">` : '-';
            
            tbody.innerHTML += `<tr>
                <td>${g.id}</td>
                <td>${g.px !== null ? g.px.toFixed(1) : '-'}</td>
                <td>${g.py !== null ? g.py.toFixed(1) : '-'}</td>
                <td>${latInput}</td>
                <td>${lonInput}</td>
            </tr>`;
        });
    }

    // ==========================================
    // 4. ピクセル単位の高精度アフィン変換（ラバーシート）
    // ==========================================
    let orthoLayers = []; 

    window.processPixelWarpOrtho = function() {
        const validGcps = gcps.filter(g => g.px !== null && g.lat !== null);
        if (validGcps.length < 3) {
            alert("写真側と地図側で、それぞれ最低3つのGCPペアを作成してください。");
            return;
        }

        const p1 = validGcps[0], p2 = validGcps[1], p3 = validGcps[2];
        const det = p1.px * (p2.py - p3.py) - p1.py * (p2.px - p3.px) + (p2.px * p3.py - p3.px * p2.py);
        if (Math.abs(det) < 1e-10) { alert("GCPが一直線上に並んでいるため変換できません。"); return; }

        const a = (p1.lon * (p2.py - p3.py) - p1.py * (p2.lon - p3.lon) + (p2.lon * p3.py - p3.lon * p2.py)) / det;
        const b = (p1.px * (p2.lon - p3.lon) - p1.lon * (p2.px - p3.px) + (p2.px * p3.lon - p3.px * p2.lon)) / det;
        const c = p1.lon - a * p1.px - b * p1.py;

        const d = (p1.lat * (p2.py - p3.py) - p1.py * (p2.lat - p3.lat) + (p2.lat * p3.py - p3.lat * p2.py)) / det;
        const e = (p1.px * (p2.lat - p3.lat) - p1.lat * (p2.px - p3.px) + (p2.px * p3.lat - p3.px * p2.lat)) / det;
        const f = p1.lat - d * p1.px - e * p1.py;

        const w = currentRotatedCanvas.width;
        const h = currentRotatedCanvas.height;
        const corners = [{x:0, y:0}, {x:w, y:0}, {x:0, y:h}, {x:w, y:h}];
        
        let minLon = Infinity, maxLon = -Infinity, minLat = Infinity, maxLat = -Infinity;
        corners.forEach(pt => {
            const lon = a * pt.x + b * pt.y + c;
            const lat = d * pt.x + e * pt.y + f;
            minLon = Math.min(minLon, lon); maxLon = Math.max(maxLon, lon);
            minLat = Math.min(minLat, lat); maxLat = Math.max(maxLat, lat);
        });

        const canvasW = 2048;
        const canvasH = Math.min(Math.max(Math.floor(canvasW * (maxLat - minLat) / (maxLon - minLon)), 100), 4096);
        
        const warpCanvas = document.createElement('canvas');
        warpCanvas.width = canvasW;
        warpCanvas.height = canvasH;
        const ctx = warpCanvas.getContext('2d');

        const A = a * (canvasW / (maxLon - minLon));
        const B = b * (canvasW / (maxLon - minLon));
        const C = (c - minLon) * (canvasW / (maxLon - minLon));
        
        const D = -d * (canvasH / (maxLat - minLat));
        const E = -e * (canvasH / (maxLat - minLat));
        const F = (maxLat - f) * (canvasH / (maxLat - minLat));

        ctx.setTransform(A, D, B, E, C, F);
        ctx.drawImage(currentRotatedCanvas, 0, 0);

        const dataUrl = warpCanvas.toDataURL('image/png');
        const overlayBounds = [[minLat, minLon], [maxLat, maxLon]];
        const newLayer = L.imageOverlay(dataUrl, overlayBounds).addTo(rightMap);
        orthoLayers.push(newLayer);
        
        alert("右画面へ高精度に合成しました。続けて別の写真を読み込んで合成可能です。");
    };

    // ==========================================
    // 5. 切り出しとエクスポート（完全透過PNG + PGW）
    // ==========================================
    window.toggleCropGuide = function() {
        const guide = document.getElementById('crop-guide');
        guide.style.display = guide.style.display === 'none' || guide.style.display === '' ? 'block' : 'none';
    };

    window.exportCroppedImage = function(exportType) {
        const guide = document.getElementById('crop-guide');
        if (guide.style.display !== 'block') {
            alert("切り出し枠を表示して、出力したい範囲を枠に合わせてください。");
            return;
        }

        if (orthoLayers.length === 0) { alert("合成された画像がありません。"); return; }

        const rect = guide.getBoundingClientRect();
        const mapRect = document.getElementById('right-map').getBoundingClientRect();
        
        const nwPoint = L.point(rect.left - mapRect.left, rect.top - mapRect.top);
        const sePoint = L.point(rect.right - mapRect.left, rect.bottom - mapRect.top);
        
        const nwLatLng = rightMap.containerPointToLatLng(nwPoint);
        const seLatLng = rightMap.containerPointToLatLng(sePoint);
        
        const outWidth = 2100;
        const outHeight = 1485;
        const canvas = document.createElement('canvas');
        canvas.width = outWidth; canvas.height = outHeight;
        const ctx = canvas.getContext('2d');

        let loadedCount = 0;

        orthoLayers.forEach(layer => {
            const img = new Image();
            img.crossOrigin = "Anonymous";
            img.onload = function() {
                const layerBounds = layer.getBounds();
                const lNw = layerBounds.getNorthWest();
                const lSe = layerBounds.getSouthEast();

                const lonRange = seLatLng.lng - nwLatLng.lng;
                const latRange = nwLatLng.lat - seLatLng.lat;

                const sx = (lNw.lng - nwLatLng.lng) / lonRange * outWidth;
                const sy = (nwLatLng.lat - lNw.lat) / latRange * outHeight;
                const sw = (lSe.lng - lNw.lng) / lonRange * outWidth;
                const sh = (lNw.lat - lSe.lat) / latRange * outHeight;

                ctx.drawImage(img, sx, sy, sw, sh);
                loadedCount++;

                if (loadedCount === orthoLayers.length) {
                    processExport(canvas, seLatLng, nwLatLng, exportType);
                }
            };
            img.src = layer._url;
        });
    };

    function processExport(canvas, seLatLng, nwLatLng, type) {
        const dataUrl = canvas.toDataURL('image/png'); 
        
        const south = seLatLng.lat.toFixed(6);
        const west = nwLatLng.lng.toFixed(6);
        const north = nwLatLng.lat.toFixed(6);
        const east = seLatLng.lng.toFixed(6);

        if (type === 'app') {
            const filename = `ortho_export_${south}_${west}_${north}_${east}.png`;
            const imgLink = document.createElement('a');
            imgLink.download = filename;
            imgLink.href = dataUrl;
            imgLink.click();
        } else if (type === 'gis') {
            const imgLink = document.createElement('a');
            imgLink.download = "ortho_export.png"; 
            imgLink.href = dataUrl;
            imgLink.click();

            const pixelWidthDeg = (seLatLng.lng - nwLatLng.lng) / canvas.width;
            const pixelHeightDeg = (seLatLng.lat - nwLatLng.lat) / canvas.height;
            const pgwContent = `${pixelWidthDeg}\n0.0000000000\n0.0000000000\n${pixelHeightDeg}\n${nwLatLng.lng}\n${nwLatLng.lat}\n`;
            const blob = new Blob([pgwContent], { type: 'text/plain' });
            
            const pgwLink = document.createElement('a');
            pgwLink.download = "ortho_export.pgw";
            pgwLink.href = URL.createObjectURL(blob);
            pgwLink.click();
        }
    }
</script>
</body>
</html>
